schema: a3_teleop/v1
pico:
  topic: pose
  connect_host: 127.0.0.1
  port: 5561
  source: gear_sonic/scripts/pico_pose_zmq_minimal.py
  format: topic + 1280-byte JSON header + concatenated binary fields
  version: 3
  required_fields:
  - smpl_pose[*,21,3]
  - smpl_joints[*,24,3]
  optional_fields:
  - body_quat_w[*,4]
  - root_translation[*,3]
  - timestamp_realtime[1]
  ignored_fields:
    joint_pos: G1-flavoured wrist estimate, NOT A3 joints
    joint_vel: same
zmq:
  high_water_mark: 1
  conflate: true
  recv_timeout_ms: 50
states:
- DISCONNECTED
- CALIBRATION
- READY
- TRACKING
- HOLD
- SAFE_STOP
recordings_dir: recordings
calibration:
  stand_still_s: 3.0
  height_scale_source: A3 pelvis height from the robot MJCF at the default pose
  save: calibration.json
reference_window:
  frames: 10
  dt: 0.02
