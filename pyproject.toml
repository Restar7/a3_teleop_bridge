[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a3-teleop-bridge"
version = "0.1.0"
description = "PICO/SMPL -> UMR -> AgiBot A3 canonical reference -> SONIC A3-fast bridge"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pyzmq>=25",
    "PyYAML>=6.0",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
pythonpath = ["src"]
addopts = "-q"
